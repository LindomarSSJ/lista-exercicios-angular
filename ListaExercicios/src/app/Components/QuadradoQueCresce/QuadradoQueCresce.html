<div class="exercicio-container">
  <h2>Exercício 1: O quadrado que cresce</h2>

  <div class="controles">
    <button (click)="diminuir()">-10</button>
    <button (click)="aumentar()">+10</button>
    <button (click)="resetar()">Reset</button>
    
    
    <span class="numero-tamanho">Tamanho atual: {{ tamanho() }}px</span>
  </div>
 
  <div 
    class="quadrado" 
    [style.width.px]="tamanho()" 
    [style.height.px]="tamanho()">
  </div>
</div>
