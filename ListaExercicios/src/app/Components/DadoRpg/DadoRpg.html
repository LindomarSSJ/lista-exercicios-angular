<div class="exercicio-container">
  <h2>Exercício 5: Dado de RPG</h2>

  <div class="dado-display">
    @if (resultadoAtual() !== null) {
      <span class="numero-dado">{{ resultadoAtual() }}</span>
    } @else {
      <span class="numero-dado">-</span>
    }
  </div>

  <div class="controles">
    <button (click)="rolarDado()">Rolar Dado 🎲</button>
  </div>

  <div class="estatisticas">
    <p>Total de rolagens: <strong>{{ totalRolagens() }}</strong></p>
    <p>Soma de todos os pontos: <strong>{{ somaResultados() }}</strong></p>
    <p>Média dos resultados: <strong>{{ mediaRolagens() }}</strong></p>
  </div>
</div>
