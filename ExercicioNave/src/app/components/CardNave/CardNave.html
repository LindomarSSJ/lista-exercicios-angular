<div class="card-nave" style="border: 1px solid #ccc; padding: 15px; margin: 10px; border-radius: 8px;">
  <h3>Nome: {{ nome() }}</h3>
  <p>Tripulação: {{ tripulacao() }}</p>
  
   
  @if (tripulacao() === 0) {
    <p style="color: red; font-weight: bold;">⚠️ Sem tripulação</p>
  }

  <p>Status: <strong>{{ status() }}</strong></p>

   
  <p>Combustível:</p>
  <div style="border: 1px solid #000; width: 100%; height: 20px; background-color: #f0f0f0; border-radius: 4px; overflow: hidden;">
    <div [style.width]="combustivel() + '%'" 
         [style.background]="corBarra()" 
         style="height: 100%; transition: width 0.3s ease;">
    </div>
  </div>
</div>
